[package]
name = "streamhub"
version = "0.1.0"
edition = "2021"
description = "StreamHub Desktop - Multistream, Aufnahme und Chat steuern"

[dependencies]
base64 = "0.23.1"
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tungstenite = "0.30.0"
ureq = "2.12"

[profile.release]
opt-level = 2
lto = false
strip = true
