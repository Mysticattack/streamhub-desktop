[package]
name = "streamhub"
version = "0.1.0"
edition = "2021"
description = "StreamHub Desktop - Multistream, Aufnahme und Chat steuern"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"

[profile.release]
opt-level = 2
lto = false
strip = true
